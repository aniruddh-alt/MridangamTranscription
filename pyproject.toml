[project]
name = "mridangam-transcription"
version = "0.1.0"
description = "Automatic transcription of mridangam strokes using deep learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchaudio",
    "librosa",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "pyaudio",
    "transformers>=4.30.0",
    "accelerate",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

